<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit Client - DesignDesk</title>
</head>
<body>

    <h1>Edit Client</h1>

    <form th:action="@{/clients/{id}/edit(id=${client.id})}"
          th:object="${client}"
          method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required>

        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}">

        <br>

        <label for="instagramHandle">Instagram:</label>
        <input type="text" id="instagramHandle" th:field="*{instagramHandle}">

        <br>

        <label for="notes">Notes:</label>
        <textarea id="notes" th:field="*{notes}"></textarea>

        <br>

        <button type="submit">Save Changes</button>

    </form>

    <a th:href="@{/clients/{id}(id=${client.id})}">
        Cancel
    </a>
</body>
</html>
