<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clients - DesignDesk</title>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>Clients</h1>

    <a href="/clients/new">Add New Client</a>

    <p th:if="${clients.isEmpty()}">
        No clients found.
    </p>

    <div th:each="client : ${clients}">
        <h2 th:text="${client.name}">Client Name</h2>

        <p>
            Email:
            <span th:text="${client.email}">email@example.com</span>
        </p>

        <p>
            Instagram:
            <span th:text="${client.instagramHandle}">@example</span>
        </p>

        <p>
            Notes:
            <span th:text="${client.notes}">Notes</span>
        </p>

        <a th:href="@{/clients/{id}(id=${client.id})}">
            View
        </a>

        <a th:href="@{/clients/{id}/edit(id=${client.id})}">
            Edit
        </a>

        <hr>
    </div>

</body>
</html>
