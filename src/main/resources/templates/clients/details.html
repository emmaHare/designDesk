<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Client Details - DesignDesk</title>
</head>
<body>
    <h1 th:text="${client.name}">Client Name</h1>

    <p>
        Email:
        <span th:text="${client.email}">email@example.com</span>
    </p>

    <p>
        Instagram:
        <span th:text="${client.instagramHandle}">@example</span>
    </p>

    <p>
        Notes:
        <span th:text="${client.notes}">Notes</span>
    </p>

    <form th:action="@{/clients/{id}/delete(id=${client.id})}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this client?');">

        <button type="submit">Delete Client</button>
    </form>

    <a th:href="@{/clients/{id}/edit(id=${client.id})}">
        Edit Client
    </a>

    <a href="/clients">Back to Clients</a>
</body>
</html>
